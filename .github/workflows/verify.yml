name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  game-and-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:economy-server
      - run: npm run check:security
      - run: npm run check:race-rules
      - run: npm run check:friend-rules
      - run: npm run check:garage-recovery
      - run: npm run check:identity-proof
      - run: npm audit --audit-level=high
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable test --locked --manifest-path contracts/near/Cargo.toml
