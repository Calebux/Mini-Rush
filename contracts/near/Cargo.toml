[package]
name = "minirush-garage"
description = "MiniRush garage: NEP-245 multi-token (RUSH coin, cars, parts) with agent-run dealer stalls"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.86"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.29.1"

[dev-dependencies]
near-sdk = { version = "5.29.1", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
